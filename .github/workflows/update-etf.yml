name: ETF 현재가 자동 업데이트

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 9-15 * * 1-5"
      timezone: "Asia/Seoul"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: requests 설치
        run: pip install requests

      - name: ETF 현재가 업데이트
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python update_etf.py
